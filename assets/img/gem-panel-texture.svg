<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="900" y2="1200">
      <stop offset="0" stop-color="#FFF9EE"/>
      <stop offset="0.42" stop-color="#F5E5C9"/>
      <stop offset="1" stop-color="#E7CFA5"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="900" y2="1200">
      <stop offset="0" stop-color="#8E5F20" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#C08A34" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#5F3D16" stop-opacity="0.12"/>
    </linearGradient>

    <radialGradient id="shine1" cx="22%" cy="14%" r="55%">
      <stop offset="0" stop-color="white" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shine2" cx="88%" cy="12%" r="48%">
      <stop offset="0" stop-color="white" stop-opacity="0.60"/>
      <stop offset="0.42" stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="1200" rx="88" fill="url(#base)"/>

  <!-- мягкое внутреннее свечение -->
  <rect width="900" height="1200" rx="88" fill="url(#shine1)"/>
  <rect width="900" height="1200" rx="88" fill="url(#shine2)"/>

  <!-- крупные грани -->
  <path d="M0 0 L250 0 L120 260 L0 430 Z" fill="white" opacity="0.22"/>
  <path d="M250 0 L560 0 L430 290 L120 260 Z" fill="#D2B783" opacity="0.16"/>
  <path d="M560 0 L900 0 L900 320 L650 250 Z" fill="white" opacity="0.26"/>
  <path d="M120 260 L430 290 L300 610 L0 560 L0 430 Z" fill="#BE9857" opacity="0.10"/>
  <path d="M430 290 L650 250 L900 320 L900 640 L570 580 Z" fill="white" opacity="0.18"/>
  <path d="M300 610 L570 580 L720 870 L440 960 L180 830 Z" fill="#9D7434" opacity="0.10"/>
  <path d="M0 560 L300 610 L180 830 L0 980 Z" fill="white" opacity="0.20"/>
  <path d="M720 870 L900 640 L900 1200 L640 1200 Z" fill="#A87A34" opacity="0.09"/>
  <path d="M0 980 L180 830 L440 960 L320 1200 L0 1200 Z" fill="white" opacity="0.16"/>
  <path d="M440 960 L720 870 L640 1200 L320 1200 Z" fill="#D5B577" opacity="0.12"/>

  <!-- линии граней -->
  <g stroke="white" stroke-opacity="0.42" stroke-width="2">
    <path d="M250 0 L120 260 L430 290 L560 0"/>
    <path d="M430 290 L300 610 L120 260"/>
    <path d="M430 290 L570 580 L650 250"/>
    <path d="M650 250 L900 320"/>
    <path d="M300 610 L180 830 L440 960 L570 580"/>
    <path d="M720 870 L570 580 L900 640"/>
    <path d="M440 960 L320 1200"/>
    <path d="M720 870 L640 1200"/>
  </g>

  <!-- коричневые прожилки -->
  <g stroke="url(#goldLine)" stroke-width="3.2" stroke-linecap="round" filter="url(#soft)">
    <path d="M450 0 C430 70 485 112 460 185 C444 235 480 270 430 330"/>
    <path d="M430 330 C500 350 520 420 575 452 C620 478 610 545 690 585"/>
    <path d="M575 452 C540 520 505 570 520 646 C534 712 490 770 448 835"/>
    <path d="M448 835 C510 860 560 910 590 990 C610 1048 650 1100 640 1200"/>
    <path d="M210 150 C278 205 322 260 338 336 C350 394 390 420 430 470"/>
    <path d="M90 700 C165 680 242 710 300 760 C350 804 380 880 440 960"/>
    <path d="M720 230 C690 305 715 370 690 440 C672 488 704 542 760 610"/>
  </g>

  <!-- тонкие вторичные трещины -->
  <g stroke="#8B5B1D" stroke-opacity="0.20" stroke-width="1.4" stroke-linecap="round">
    <path d="M460 185 L535 160"/>
    <path d="M430 330 L365 365"/>
    <path d="M575 452 L655 415"/>
    <path d="M520 646 L610 700"/>
    <path d="M448 835 L360 875"/>
    <path d="M300 760 L250 820"/>
    <path d="M690 440 L770 470"/>
  </g>

  <!-- блески по углам -->
  <path d="M54 64 L158 34 L108 124 Z" fill="white" opacity="0.45"/>
  <path d="M820 74 L875 160 L760 128 Z" fill="white" opacity="0.34"/>
  <path d="M72 1100 L170 1146 L54 1170 Z" fill="white" opacity="0.30"/>
  <path d="M760 1110 L875 1045 L842 1180 Z" fill="white" opacity="0.24"/>

  <!-- золотая оправа -->
  <rect x="8" y="8" width="884" height="1184" rx="80" stroke="#B98535" stroke-opacity="0.55" stroke-width="5"/>
  <rect x="17" y="17" width="866" height="1166" rx="72" stroke="white" stroke-opacity="0.52" stroke-width="2"/>
</svg>
